modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/evanbones/Modulation/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "${mod_id}.png"
iconFile = "${mod_id}.png"
credits = "${credits}"
authors = "${mod_author}"
description = '''${description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[mixins]]
config = "${mod_id}.neoforge.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "yet_another_config_lib_v3"
type = "optional"
versionRange = "[${yacl_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "emi"
type = "optional"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "[19.34,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "sodium"
type = "optional"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "polytone"
type = "optional"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "figura"
type = "optional"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "vanillabackport"
type = "optional"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "farmersdelight"
type = "optional"
