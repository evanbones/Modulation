plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }

    // EMI
    modRuntimeOnly "dev.emi:emi-fabric:${emi_version}"

    // YACL
    modImplementation "maven.modrinth:yacl:${yacl_version}-fabric"
    implementation "org.quiltmc.parsers:json:0.3.0"
    implementation "org.quiltmc.parsers:gson:0.3.0"
    include "org.quiltmc.parsers:json:0.3.0"
    include "org.quiltmc.parsers:gson:0.3.0"
    modImplementation "com.terraformersmc:modmenu:${mod_menu_version}"

    // Figura
    modCompileOnly "maven.modrinth:figura:${figura_version_fabric}"

    // Reconnectible Chains
    modCompileOnly "maven.modrinth:reconnectible-chains:${reconnectible_chains_version}-fabric"
    // modRuntimeOnly "maven.modrinth:ziplines-rezipped:${ziplines_version}-fabric"
    modCompileOnly "maven.modrinth:cloth-config:${cloth_config_version}+fabric"

    // Sodium
    modCompileOnly "net.caffeinemc:sodium-fabric:${sodium_version}"
    modCompileOnly "net.caffeinemc:sodium-fabric-api:${sodium_version}"

    // Vanilla Backport
    modCompileOnly "maven.modrinth:vanillabackport:ayvoY8lx"

    compileOnly 'com.google.auto.service:auto-service-annotations:1.1.1'
    annotationProcessor 'com.google.auto.service:auto-service:1.1.1'

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

publishMods {
    file = tasks.named("remapJar").flatMap { it.archiveFile }
}